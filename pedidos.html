<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haz tu pedido · La Cachanilla Panadería Mexicana</title>
<meta name="description" content="Catálogo de la semana de La Cachanilla. Elige tu pan dulce y envía tu pedido por WhatsApp.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/marca/icono-32.png">
<link rel="apple-touch-icon" href="assets/img/marca/icono-180.png">
<meta property="og:title" content="Haz tu pedido · La Cachanilla Panadería Mexicana">
<meta property="og:description" content="Catálogo de la semana de La Cachanilla. Elige tu pan dulce y envía tu pedido por WhatsApp.">
<meta property="og:site_name" content="La Cachanilla">
<meta property="og:image" content="assets/img/marca/compartir.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#006b50">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Lobster&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="pedidos">
<div id="site-header"></div>
<main>
  <div class="cabeza"><h1 id="semana">Catálogo de la semana</h1><p id="nota"></p></div>
  <section>
    <div class="wrap pedido-layout">
      <div>
        <div class="filtros" id="filtros"></div>
        <div class="grid" id="catalogo"></div>
      </div>

      <aside class="resumen" id="resumen">
        <h3>Tu pedido</h3>
        <div id="lineas"><p class="nota">Aún no has elegido nada. Usa el botón <b>+</b> en cada producto.</p></div>
        <div class="tot"><span>Subtotal</span><span id="total">$0.00</span></div>
        <p class="nota">+ IVU aplicable. Pagas al recoger (efectivo, ATH Móvil o tarjeta).</p>
        <form class="form" id="form">
          <label for="nombre">Tu nombre *</label>
          <input id="nombre" required autocomplete="name">
          <label for="tel">Teléfono *</label>
          <input id="tel" type="tel" required autocomplete="tel" placeholder="787-000-0000">
          <label for="fecha">¿Para cuándo? *</label>
          <input id="fecha" type="date" required>
          <label for="entrega">¿Cómo lo recibes?</label>
          <select id="entrega">
            <option>Recojo en el próximo evento/mercado</option>
            <option>Recojo en punto acordado</option>
            <option>Pedido para fiesta/evento (coordinar)</option>
          </select>
          <label for="notas">Notas</label>
          <textarea id="notas" rows="2" placeholder="Ej. 6 conchas de chocolate y 6 de vainilla"></textarea>
          <button class="btn btn-rosa" style="width:100%;justify-content:center;margin-top:16px" id="enviar" disabled>Enviar pedido por WhatsApp</button>
          <button type="button" class="btn btn-borde" style="width:100%;justify-content:center;margin-top:8px" id="vaciar">Vaciar</button>
        </form>
      </aside>
    </div>
  </section>
  <div class="barra-movil"><b id="mCount">0 productos</b><span id="mTotal">$0.00</span><a class="btn btn-rosa" style="padding:10px 16px" href="#resumen">Ver pedido</a></div>
</main>
<div id="site-footer"></div>
<script src="assets/js/catalogo.js"></script>
<script src="assets/js/site.js"></script>
<script>
  const D = window.CACHANILLA;
  const P = D.productos.filter(p => p.disponible);
  const byId = id => P.find(p => p.id === id);
  let pedido = {};
  try { pedido = JSON.parse(localStorage.getItem('cach_pedido') || '{}'); } catch (e) {}
  Object.keys(pedido).forEach(id => { if (!byId(id)) delete pedido[id]; });
  const guardar = () => { try { localStorage.setItem('cach_pedido', JSON.stringify(pedido)); } catch (e) {} };

  $('#semana').textContent = D.semana;
  $('#nota').textContent = D.pedidosNota;
  const min = new Date(Date.now() + 2 * 864e5);
  $('#fecha').min = min.toISOString().slice(0, 10);

  const cats = ['Todo', ...new Set(P.map(p => p.cat))];
  let actual = 'Todo';

  function pintarCatalogo() {
    $('#filtros').innerHTML = cats.map(c => `<button class="${c === actual ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
    $('#catalogo').innerHTML = P.filter(p => actual === 'Todo' || p.cat === actual).map(p => `
      <article class="card ${pedido[p.id] ? 'sel' : ''}" data-id="${p.id}">
        <div class="img">${fotoProducto(p)}<span class="tag">${esc(p.cat)}</span></div>
        <div class="body">
          <h3>${esc(p.nombre)}</h3><p>${esc(p.desc)}</p>
          <div class="precio">${money(p.precio)}</div>
          <div class="qty">
            <button type="button" data-d="-1" aria-label="Quitar uno">−</button>
            <output>${pedido[p.id] || 0}</output>
            <button type="button" class="mas" data-d="1" aria-label="Agregar uno">+</button>
          </div>
        </div>
      </article>`).join('') || '<p class="nota">No hay productos disponibles esta semana.</p>';
  }

  function pintarResumen() {
    const ids = Object.keys(pedido);
    let total = 0, n = 0;
    $('#lineas').innerHTML = ids.length ? ids.map(id => {
      const p = byId(id), q = pedido[id]; total += p.precio * q; n += q;
      return `<div class="lin"><span>${q} × ${esc(p.nombre)}</span><b>${money(p.precio * q)}</b></div>`;
    }).join('') : '<p class="nota">Aún no has elegido nada. Usa el botón <b>+</b> en cada producto.</p>';
    $('#total').textContent = $('#mTotal').textContent = money(total);
    $('#mCount').textContent = n + (n === 1 ? ' producto' : ' productos');
    $('#enviar').disabled = !n;
  }

  $('#filtros').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { actual = b.dataset.c; pintarCatalogo(); } });
  $('#catalogo').addEventListener('click', e => {
    const b = e.target.closest('button[data-d]'); if (!b) return;
    const card = b.closest('.card'), id = card.dataset.id;
    pedido[id] = Math.max(0, (pedido[id] || 0) + Number(b.dataset.d));
    if (!pedido[id]) delete pedido[id];
    card.querySelector('output').textContent = pedido[id] || 0;
    card.classList.toggle('sel', !!pedido[id]);
    guardar(); pintarResumen();
  });
  $('#vaciar').addEventListener('click', () => { pedido = {}; guardar(); pintarCatalogo(); pintarResumen(); });

  $('#form').addEventListener('submit', e => {
    e.preventDefault();
    const ids = Object.keys(pedido); if (!ids.length) return;
    const f = new Date($('#fecha').value + 'T12:00').toLocaleDateString('es-PR', { weekday: 'long', day: 'numeric', month: 'long' });
    let total = 0;
    const lineas = ids.map(id => { const p = byId(id), q = pedido[id]; total += p.precio * q; return `• ${q} × ${p.nombre} — ${money(p.precio * q)}`; });
    const msg = [
      `¡Hola ${D.negocio.nombre}! 🌮 Quiero hacer un pedido:`, '',
      ...lineas, '',
      `Subtotal: ${money(total)} (+ IVU)`,
      `Nombre: ${$('#nombre').value.trim()}`,
      `Teléfono: ${$('#tel').value.trim()}`,
      `Para: ${f}`,
      `Entrega: ${$('#entrega').value}`,
      $('#notas').value.trim() ? `Notas: ${$('#notas').value.trim()}` : ''
    ].filter((l, i, a) => l !== '' || a[i - 1] !== '').join('\n');
    window.open(`https://wa.me/${D.negocio.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
    toast('Abriendo WhatsApp… envía el mensaje para confirmar tu pedido');
  });

  pintarCatalogo(); pintarResumen();
</script>
</body>
</html>
