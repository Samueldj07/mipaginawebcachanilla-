<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursos de repostería mexicana · La Cachanilla</title>
<meta name="description" content="Aprende repostería mexicana con La Cachanilla: conchas, pan dulce y más, paso a paso.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/marca/icono-32.png">
<link rel="apple-touch-icon" href="assets/img/marca/icono-180.png">
<meta property="og:title" content="Cursos de repostería mexicana · La Cachanilla">
<meta property="og:description" content="Aprende repostería mexicana con La Cachanilla: conchas, pan dulce y más, paso a paso.">
<meta property="og:site_name" content="La Cachanilla">
<meta property="og:image" content="assets/img/marca/compartir.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#006b50">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Lobster&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<script>window.phFoto=function(i){(window._phq=window._phq||[]).push(i)}</script>
</head>
<body data-page="cursos">
<div id="site-header"></div>
<main>
  <div class="cabeza"><h1>Cursos</h1><p>Aprende repostería mexicana con nuestras recetas, paso a paso y desde tu casa.</p></div>
  <section>
    <div class="wrap">
      <div class="cursos" id="lista"></div>
    </div>
  </section>
  <section class="bg-rosa">
    <div class="wrap" style="text-align:center">
      <div class="titulo rev"><div class="cenefa"></div><h2>¿Tienes preguntas sobre un curso?</h2><p>Escríbenos y te contamos qué incluye, cómo se accede y cuándo abre el próximo.</p></div>
      <a class="btn btn-rosa" id="waPreg" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="assets/js/catalogo.js"></script>
<script src="assets/js/site.js"></script>
<script>
  const D = window.CACHANILLA, wa = D.negocio.whatsapp;
  const waLink = t => `https://wa.me/${wa}?text=${encodeURIComponent(t)}`;
  /* Video de muestra: YouTube o Instagram → reproductor incrustado */
  function videoEmbed(u) {
    u = String(u || '').trim(); let m;
    if ((m = u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/))) return `https://www.youtube-nocookie.com/embed/${m[1]}`;
    if ((m = u.match(/instagram\.com\/(?:reel|p)\/([\w-]+)/))) return `https://www.instagram.com/p/${m[1]}/embed`;
    return '';
  }
  const cursos = (D.cursos || []).filter(c => c.publicado);
  $('#lista').innerHTML = cursos.length ? cursos.map(c => {
    const v = videoEmbed(c.video);
    const comprar = c.enlace
      ? `<a class="btn btn-rosa" href="${esc(c.enlace)}" target="_blank" rel="noopener">${esc(c.boton || 'Comprar curso')}</a>`
      : `<a class="btn btn-azul" href="${waLink('¡Hola La Cachanilla! Quiero que me avisen cuando salga el curso: ' + c.titulo)}" target="_blank" rel="noopener">Avísame cuando salga</a>`;
    return `<article class="curso rev">
      <div class="portada">${v ? `<iframe src="${esc(v)}" title="Muestra del curso ${esc(c.titulo)}" loading="lazy" allowfullscreen allow="encrypted-media; picture-in-picture"></iframe>` : fotoProducto({ img: c.img, nombre: c.titulo })}
        ${c.nivel && !v ? `<span class="nivel">${esc(c.nivel)}</span>` : ''}</div>
      <div class="body">
        <h3>${esc(c.titulo)}</h3>
        <div class="meta">${c.nivel ? `<span>🎯 ${esc(c.nivel)}</span>` : ''}${c.duracion ? `<span>⏱ ${esc(c.duracion)}</span>` : ''}${c.modalidad ? `<span>💻 ${esc(c.modalidad)}</span>` : ''}</div>
        <p>${esc(c.desc).replace(/\n/g, '<br>')}</p>
        ${(c.incluye || []).length ? `<ul>${c.incluye.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
        <div class="pie-curso"><div class="precio">${c.precio > 0 ? money(c.precio) : 'Gratis'}${c.enlace ? '' : ' <small>· próximamente</small>'}</div>${comprar}</div>
      </div>
    </article>`;
  }).join('') : `<div class="cursos-vacio rev">
      <h3>Próximamente: cursos de repostería mexicana</h3>
      <p>Estamos preparando cursos para que aprendas a hacer en casa nuestras conchas, pan dulce y más. Déjanos tu nombre y te avisamos primero.</p>
      <a class="btn btn-rosa" href="${waLink('¡Hola La Cachanilla! Quiero que me avisen cuando salgan los cursos de repostería mexicana.')}" target="_blank" rel="noopener">Avísame por WhatsApp</a>
    </div>`;
  $('#lista').style.display = cursos.length ? '' : 'block';
  $('#waPreg').href = waLink('¡Hola La Cachanilla! Tengo una pregunta sobre los cursos.');
  revelar();
</script>
</body>
</html>
